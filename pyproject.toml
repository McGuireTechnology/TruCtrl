[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
[project]
name = "tructrl"
version = "0.1.0"
description = "TruCtrl PyPI project with subprojects: api, web, android, apple, docs."
authors = [
    { name="McGuire Technology, LLC", email="hello@mcguire.technology" }
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
scripts = { cli = "api.cli:main" }
urls = { homepage = "https://tructrl.app", documentation = "https://docs.tructrl.app", source = "https://github.com/mcguiretechnology/tructrl", issues = "https://github.com/mcguiretechnology/tructrl/issues" }
dependencies = [
    "fastapi[standard]>=0.110.0",
    "uvicorn[standard]>=0.22.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.16",
    "alembic>=1.13.0",
    "ulid-py>=1.1.0",
    "pydantic-settings>=2.0.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4"
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
    "mike>=2.0.0",
    "mkdocs-include-markdown-plugin>=6.0.0",
    "pymdown-extensions>=10.0.0",
    "mkdocs-macros-plugin>=1.0.0",
    "mkdocs-exclude>=1.0.0"
]
dev = [
    "black>=24.0.0",
    "isort>=5.12.0",
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.7.0",
    "mkdocs-exclude>=1.0.0",
    "coverage>=7.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
    "pytest-mock>=3.14.0"
]

[tool.setuptools.packages.find]
where = ["api"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.mypy]
python_version = 3.8
ignore_missing_imports = true
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=api"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["api"]

[tool.ruff]
line-length = 88
target-version = "py38"
select = ["E", "F", "B", "I", "UP", "C90"]

[tool.bandit]
skips = ["B101"]


